name: Release
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
jobs:
  acceptance:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: acceptance
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - name: Verify archive set, tag, and checksums
        shell: bash
        run: |
          cd dist
          version=${GITHUB_REF_NAME#v}
          for target in x86_64-unknown-linux-gnu x86_64-unknown-linux-musl aarch64-apple-darwin; do
            test -f "takt-$version-$target.tar.gz"
            sha256sum -c "takt-$version-$target.tar.gz.sha256"
          done
          cat ./*.tar.gz.sha256 > SHA256SUMS
      - name: Publish validated archives and measurements
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*.tar.gz dist/*.tar.gz.sha256 dist/SHA256SUMS dist/*-size.json dist/*-performance.json
