[package]
name = "takt"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Resource-aware command scheduling and process supervision"
license = "MIT OR Apache-2.0"
repository = "https://github.com/samishal1998/takt"
default-run = "takt"

[workspace]
members = ["tests/fixtures"]
resolver = "3"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
granit-parser = "2.0.0"
lexopt = "0.3.2"
mio = { version = "1", features = ["os-poll", "os-ext", "net"] }
signal-hook = "0.3"
ureq-proto = "0.6.4"
libc = "0.2"
base64 = "0.22"

[dev-dependencies]
jsonschema = { version = "0.59.0", default-features = false }
proptest = "1"
tempfile = "3"
takt-test-fixture = { path = "tests/fixtures" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "unwind"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
